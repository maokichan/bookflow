<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>bookflow</title>
<style>
  :root {
    --ink: #2a2a28; --paper: #faf9f6; --desk: #eceade; --line: #d8d4cc; --dim: #8a857c;
    --accent: #b4552d; --ok: #4a7c59; --hair: #e4e0d6;
  }
  * { box-sizing: border-box; }
  /* 滚动条：只写 ::-webkit-scrollbar，绝不写 scrollbar-width/scrollbar-color ——
     Chromium 121+ 起写了标准属性，webkit 规则会被整个忽略（TuRead STYLE.md 实测的坑） */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(42,42,40,.12); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(42,42,40,.28); }
  body { margin: 0; background: var(--desk); color: var(--ink);
    font-family: "Times New Roman", "Noto Serif SC", "SimSun", serif; }
  button { font: inherit; background: none; border: none; color: var(--ink); cursor: pointer; padding: 0; }
  .ta { font-size: 15px; font-weight: 700; letter-spacing: .02em; color: var(--ink); }
  .ta:hover { color: var(--accent); }
  .ta.acc { color: var(--accent); }
  .ta[disabled] { color: var(--dim); cursor: default; }

  header { display: flex; align-items: baseline; gap: 20px; padding: 14px 26px 10px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: .04em; }
  header .sp { flex: 1; }

  main { max-width: 1180px; margin: 0 auto; padding: 6px 26px 80px; }

  /* 书架 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 26px 22px; }
  .card { cursor: pointer; }
  .cover { width: 100%; aspect-ratio: 5/7; background: var(--paper); border: 1px solid var(--line);
    overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .tcov { padding: 18px; font-size: 17px; font-weight: 700; line-height: 1.5; text-align: center; color: var(--ink); }
  .card:hover .cover { border-color: var(--ink); }
  .card .t { font-size: 15px; font-weight: 700; margin-top: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 2px; background: var(--hair); margin-top: 7px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .card .p { font-size: 12.5px; color: var(--dim); margin-top: 5px; }

  /* 书详情 */
  .detail { display: flex; gap: 34px; align-items: flex-start; }
  .dcover { width: 150px; flex: none; }
  .dcover .cover { aspect-ratio: 5/7; }
  .dcover .t { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .pipe { flex: 1; padding-top: 26px; }
  .nodes { display: flex; align-items: flex-start; }
  .node { flex: 1; text-align: center; position: relative; }
  .node .dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--dim);
    background: var(--desk); margin: 0 auto; position: relative; z-index: 1; }
  .node.done .dot { background: var(--ink); border-color: var(--ink); }
  .node.cur .dot { border-color: var(--accent); background: var(--paper); box-shadow: 0 0 0 3px rgba(180,85,45,.18); }
  .node::before { content: ""; position: absolute; top: 6px; left: -50%; width: 100%; height: 1.5px; background: var(--dim); opacity: .4; }
  .node:first-child::before { display: none; }
  .node.done::before, .node.cur::before { background: var(--ink); opacity: 1; }
  .node .lb { font-size: 13px; margin-top: 9px; color: var(--dim); }
  .node.done .lb, .node.cur .lb { color: var(--ink); }
  .node .sub { font-size: 11px; color: var(--dim); margin-top: 3px; min-height: 14px; }
  .node .act { margin-top: 10px; min-height: 24px; }

  .tasks { margin-top: 46px; font-size: 12.5px; color: var(--dim); line-height: 1.9; }
  .tasks .ok { color: var(--ok); } .tasks .bad { color: #a8322a; } .tasks .run { color: var(--accent); }

  /* 配置（功能层级） */
  #cfg { position: fixed; inset: 0; background: rgba(42,42,40,.35); display: none; z-index: 50; }
  #cfg .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: var(--paper); border: 1px solid var(--line); width: min(560px, 92vw); max-height: 86vh; overflow: auto; padding: 22px 26px; }
  #cfg h3 { font-size: 15px; margin: 18px 0 8px; }
  #cfg h3:first-child { margin-top: 0; }
  #cfg label { display: block; font-size: 12.5px; color: var(--dim); margin: 8px 0 3px; }
  #cfg input { width: 100%; padding: 6px 9px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 13px; }
  #cfg .row { display: flex; gap: 18px; justify-content: flex-end; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <button class="ta" id="homeBtn" style="display:none">‹ 书架</button>
  <h1>bookflow</h1>
  <span class="sp"></span>
  <button class="ta" id="cfgBtn">能力配置</button>
</header>
<main id="main"></main>

<div id="cfg">
  <div class="panel">
    <h3>OCR · 云端</h3>
    <label>接口地址</label><input id="c-ocrcloud-url" type="text">
    <label>密钥</label><input id="c-ocrcloud-key" type="password">
    <label>模型</label><input id="c-ocrcloud-model" type="text">
    <h3>OCR · 本地</h3>
    <label>引擎</label><input id="c-ocrlocal-engine" type="text" placeholder="">
    <h3>LLM</h3>
    <label>接口地址</label><input id="c-llm-url" type="text">
    <label>密钥</label><input id="c-llm-key" type="password">
    <label>模型</label><input id="c-llm-model" type="text">
    <div class="row">
      <button class="ta" id="cfgClose">关闭</button>
      <button class="ta acc" id="cfgSave">保存</button>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = (p, body) => fetch(p, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : undefined)
  .then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });

// 兜底网：动作失败不得无声——漏接的失败在这里现形（正常路径各自 try/catch，这里只兜遗漏）
window.addEventListener("unhandledrejection", (e) => {
  console.error("未接住的失败：", e.reason);
  toast(e.reason?.message ?? String(e.reason));
});

const STAGES = [
  { key: "import", label: "导入" },
  { key: "prep", label: "预处理" },
  { key: "process", label: "识别" },
  { key: "proof", label: "原文校对" },
  { key: "mt", label: "翻译" },
  { key: "proof2", label: "双语校对" },
  { key: "check", label: "机器检查" },
];
const BEHAVIOR_LABEL = { process: "识别", extract: "抽取", render: "页图", export: "工作台", replay: "回放" };

function nodeState(key, b, inflight) {
  const s = b.stage, pr = b.progress;
  if (key === "import") return "done";
  if (key === "prep") {
    if (inflight) return "run";
    return b.params && b.params.confirmedAt ? "done" : (s.exported ? "done" : "cur"); // 已识别的老书视作预处理已过
  }
  if (key === "process") {
    if (inflight) return "run";
    if (s.exported) return "done";
    const v = b.acts && b.acts.process; // 解锁资格来自服务端行为表（单一真相），前端只负责画
    return v && !v.ok ? "lock" : "cur";
  }
  if (key === "proof") return s.exported ? (pr.proofTotal && pr.proofDone >= pr.proofTotal ? "done" : "cur") : "lock";
  return "lock"; // 翻译 / 双语校对 / 机器检查：策略位未点亮
}

// ---------- 书架 ----------
async function renderShelf() {
  location.hash === "" && history.replaceState({ guard: true }, "", "#");
  document.getElementById("homeBtn").style.display = "none";
  document.getElementById("cfgBtn").style.display = "";
  const books = await api("/api/books");
  const main = document.getElementById("main");
  main.innerHTML = "";

  const imp = $(`<div class="row" style="margin-bottom:30px">
    <input type="file" id="f-pdf" accept=".pdf,application/pdf" style="font:inherit;font-size:13px">
    <input type="text" id="f-title" placeholder="书名" style="width:220px;padding:5px 9px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:13px">
    <button class="ta acc" id="f-go">导入</button></div>`);
  main.appendChild(imp);
  imp.querySelector("#f-pdf").addEventListener("change", function () {
    const f = this.files[0];
    if (f && !imp.querySelector("#f-title").value) imp.querySelector("#f-title").value = f.name.replace(/\.pdf$/i, "");
  });
  imp.querySelector("#f-go").onclick = async () => {
    try {
      const f = imp.querySelector("#f-pdf").files[0];
      if (!f) throw new Error("先选 PDF");
      const q = new URLSearchParams({ title: imp.querySelector("#f-title").value || f.name.replace(/\.pdf$/i, ""), name: f.name });
      const m = await fetch("/api/books/upload?" + q, { method: "POST", body: f })
        .then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });
      location.hash = "#/b/" + m.id;
    } catch (e) { toast(e.message); }
  };

  const grid = $(`<div class="grid"></div>`);
  main.appendChild(grid);
  for (const b of books) {
    const pr = b.progress || { pct: 0 };
    const card = $(`<div class="card">
      <div class="cover">${b.stage.rendered
        ? `<img src="/library/${encodeURIComponent(b.id)}/pages/p001.png" onerror="this.parentNode.innerHTML='<div class=tcov>${esc(b.title)}</div>'">`
        : `<div class="tcov">${esc(b.title)}</div>`}</div>
      <div class="t">${esc(b.title)}</div>
      <div class="bar"><i style="width:${pr.pct}%"></i></div>
      <div class="p">${pr.pct}%${b.inflight ? " · 识别中" : ""}</div>
    </div>`);
    card.onclick = () => { location.hash = "#/b/" + b.id; };
    grid.appendChild(card);
  }
  pollBooks(() => { if (location.hash === "" || location.hash === "#") renderShelf(); });
}

// ---------- 书详情：流水线即状态，动作绑在当前节点上 ----------
async function renderBook(id) {
  document.getElementById("homeBtn").style.display = "";
  document.getElementById("cfgBtn").style.display = "none";
  const b = await api("/api/books/" + encodeURIComponent(id));
  const tasks = (await api("/api/tasks")).filter((t) => t.book === id).slice(0, 5);
  const inflight = (await api("/api/tasks")).some((t) => t.book === id && (t.status === "queued" || t.status === "running"));
  const main = document.getElementById("main");
  const pr = b.progress, s = b.stage;
  const states = Object.keys(STAGES).map(() => "");

  const nodes = STAGES.map((st) => {
    const k = nodeState(st.key, b, inflight && st.key === "process");
    const cls = k === "done" ? "done" : k === "cur" ? "cur" : k === "run" ? "cur" : "";
    let sub = "", act = "";
    if (st.key === "prep") sub = (b.params && b.params.confirmedAt) ? `${b.params.contrast}% / 降${b.params.denoise ? "开" : "关"} / 锐${b.params.sharpen}` : (s.exported ? "沿用现状" : "");
    if (st.key === "proof" && s.exported) sub = `${pr.proofDone} / ${pr.proofTotal}`;
    if (st.key === "prep" && k === "run") act = `<button class="ta" disabled>处理中…</button>`;
    if (st.key === "prep" && k === "cur") act = `<button class="ta acc" data-a="prep">预处理</button>`;
    if (st.key === "prep" && k === "done") act = `<button class="ta" data-a="prep" style="font-size:12.5px">参数</button>`;
    if (st.key === "process" && k === "run") act = `<button class="ta" disabled>识别中…</button>`;
    if (st.key === "process" && k === "lock") act = `<span style="font-size:11px;color:var(--dim)">${esc((b.acts && b.acts.process && b.acts.process.reason) || "先完成预处理")}</span>`;
    if (st.key === "process" && k === "cur") act = `<button class="ta acc" data-a="process">识别</button>`;
    if (st.key === "proof" && s.exported) act = `<button class="ta acc" data-a="proof">校对</button>`;
    return `<div class="node ${cls}"><div class="dot"></div><div class="lb">${st.label}</div><div class="sub">${sub}</div><div class="act">${act}</div></div>`;
  }).join("");

  main.innerHTML = "";
  main.appendChild($(`<div class="detail">
    <div class="dcover">
      <div class="cover">${s.rendered
        ? `<img src="/library/${encodeURIComponent(id)}/pages/p001.png" onerror="this.style.display='none'">`
        : `<div class="tcov">${esc(b.title)}</div>`}</div>
      <div class="t">${pr.pct}%</div>
    </div>
    <div class="pipe"><div class="nodes">${nodes}</div></div>
  </div>`));

  // 版本：显式存版 + 阶段自动存版，可恢复
  const vers = await api(`/api/books/${encodeURIComponent(id)}/versions`);
  if (vers.length) {
    const vp = $(`<div class="panel" style="margin-top:26px"><h2>版本</h2></div>`);
    for (const v of vers.slice(0, 8)) {
      const row = $(`<div class="row" style="font-size:12.5px;color:var(--dim);line-height:2">
        <span style="color:var(--ink);min-width:52px">v${v.v}</span>
        <span style="flex:1">${esc(v.label || "自动")}</span>
        <span>${v.blocks} 块 · 已定 ${v.done}</span>
        <span>${(v.ts || "").slice(5, 16).replace("T", " ")}</span>
        <button class="ta" data-v="${esc(v.file)}">恢复</button></div>`);
      const btn = row.querySelector("button");
      btn.onclick = async () => {
        if (btn.dataset.armed !== "1") { btn.dataset.armed = "1"; btn.textContent = "确认恢复"; btn.classList.add("acc"); return; }
        try {
          await api(`/api/books/${encodeURIComponent(id)}/versions/${encodeURIComponent(v.file)}/restore`, {});
          toast("已恢复到 v" + v.v);
          renderBook(id);
        } catch (e) { toast(e.message); }
      };
      vp.appendChild(row);
    }
    main.appendChild(vp);
  }

  const tk = $(`<div class="tasks"></div>`);
  for (const t of tasks) {
    const secs = t.startedAt && t.endedAt ? Math.round((new Date(t.endedAt) - new Date(t.startedAt)) / 1000) : null;
    tk.appendChild($(`<div>${t.status === "done" ? '<span class="ok">✓</span>' : t.status === "error" ? '<span class="bad">✗</span>' : '<span class="run">…</span>'}
      ${BEHAVIOR_LABEL[t.behavior] || t.behavior}${secs != null ? " · " + secs + " 秒" : ""}
      <span style="opacity:.6">${(t.endedAt || "").slice(5, 16).replace("T", " ")}</span></div>`));
  }
  if (tasks.length) main.appendChild(tk);

  // 底部：删除（软删除，数据保留；两次确认）
  const dz = $(`<div class="panel" style="margin-top:46px;display:flex;justify-content:flex-end">
    <button class="ta" id="del-btn" style="color:#a8322a">删除这本书</button></div>`);
  main.appendChild(dz);
  const delBtn = dz.querySelector("#del-btn");
  delBtn.onclick = async () => {
    if (delBtn.dataset.step !== "1") {
      delBtn.dataset.step = "1";
      delBtn.textContent = "再点一次确认删除（数据保留，可找回）";
      setTimeout(() => { delBtn.dataset.step = ""; delBtn.textContent = "删除这本书"; }, 4000);
      return;
    }
    try { await deleteBook(id); } catch (e) { toast(e.message); }
  };

  main.querySelectorAll("button[data-a]").forEach((btn) => {
    btn.onclick = async () => {
      try {
        if (btn.dataset.a === "process") {
          await openOcrPick(id);
        } else if (btn.dataset.a === "reprocess") {
          await api(`/api/books/${encodeURIComponent(id)}/tasks`, { behavior: "reprocess" });
          renderBook(id);
        } else if (btn.dataset.a === "prep") {
          await togglePrepPanel(id);
        } else if (btn.dataset.a === "proof") {
          window.open(`/library/${encodeURIComponent(id)}/workbench.html`, "_blank");
        }
      } catch (e) { toast(e.message); }
    };
  });

  pollBooks(() => { if (location.hash === "#/b/" + id) renderBook(id); });
}

// ---------- 轮询：只在有任务运行时刷新（失败不惊动人，下个周期再试；留痕限频防刷屏） ----------
let pollTimer = null;
let lastPollWarn = 0;
function pollBooks(fn) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const books = await api("/api/books");
      if (books.some((b) => b.inflight)) fn();
    } catch (e) {
      if (Date.now() - lastPollWarn > 30000) { console.warn("轮询失败（30 秒内不重复提醒）——", e); lastPollWarn = Date.now(); }
    }
  }, 2000);
}

// ---------- 路由 + 返回键守卫：书架上一级的返回留在书架，不退出 ----------
function route() {
  const m = location.hash.match(/^#\/b\/(.+)$/);
  if (m) renderBook(decodeURIComponent(m[1])).catch(toastErr);
  else {
    renderShelf().catch(toastErr);
    history.pushState({ guard: true }, "", location.href); // 困留：书架再按返回仍是书架
  }
}
window.addEventListener("hashchange", route);
window.addEventListener("popstate", () => {
  if (location.hash === "" || location.hash === "#") history.pushState({ guard: true }, "", location.href);
});
document.getElementById("homeBtn").onclick = () => { location.hash = ""; };
function toastErr(e) { toast(e.message ?? String(e)); }

// ---------- 提示条（只反馈动作结果，不放说明） ----------
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = $(`<div id="toast" style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 18px;border-radius:4px;font-size:13px;z-index:60"></div>`); document.body.appendChild(t); }
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = "none"), 2600);
}

// ---------- 预处理面板：详情页内嵌，按钮开合，打开时拉采样 ----------
async function togglePrepPanel(id) {
  let panel = document.getElementById("prepanel");
  if (panel) {
    panel.remove();
    document.querySelectorAll("[data-bandpop]").forEach((el) => el.remove());
    return;
  }
  const b = await api(`/api/books/${encodeURIComponent(id)}`);
  const main = document.getElementById("main");
  panel = document.createElement("div");
  panel.className = "panel";
  panel.id = "prepanel";
  panel.style.marginTop = "26px";
  panel.innerHTML = `<h2>预处理</h2>
    <div style="display:flex;gap:22px;align-items:stretch">
      <div id="fx-samples" style="flex:1;display:flex;gap:14px;overflow-x:auto;align-items:flex-start;min-height:420px"></div>
      <div style="width:230px;flex:none;display:flex;flex-direction:column;gap:14px">
        <div>
          <div style="font-size:12.5px;color:var(--dim);margin-bottom:4px">对比度 <b id="fx-cv"></b>%</div>
          <input id="fx-c" type="range" min="50" max="300" step="5" style="width:100%">
        </div>
        <div>
          <div style="font-size:12.5px;color:var(--dim);margin-bottom:4px">降噪档 <b id="fx-dv"></b>（0 关 / 1 中值 / 2 强）</div>
          <input id="fx-d" type="range" min="0" max="2" step="1" style="width:100%">
        </div>
        <div>
          <div style="font-size:12.5px;color:var(--dim);margin-bottom:4px">锐化 <b id="fx-sv"></b></div>
          <input id="fx-s" type="range" min="0" max="200" step="10" style="width:100%">
        </div>
        <div>
          <div style="font-size:12.5px;color:var(--dim);margin-bottom:4px">OCR 引擎</div>
          <select id="fx-ocr" style="width:100%;padding:5px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px">
            <option value="textlayer">书籍自带文本层</option>
            <option value="cloud" disabled>云端 OCR（未点亮）</option>
            <option value="local" disabled>本地 OCR（未点亮）</option>
          </select>
        </div>
        <div class="row" style="margin-top:auto">
          <button class="ta" id="fx-draw">标区域</button>
        </div>
        <div>
          <div style="font-size:12.5px;color:var(--dim);margin-bottom:4px">已标横带（点 ✕ 删除）</div>
          <div id="band-list" style="font-size:12px;line-height:2;color:var(--ink)"></div>
        </div>
        <div class="row">
          <button class="ta" id="fx-refresh">刷新采样</button>
          <button class="ta acc" id="fx-confirm">确定预处理</button>
        </div>
        <div style="font-size:11.5px;color:var(--dim)">在采样图上纵向拖一条横带，标为页眉或页脚；全书生效；新带与旧带重叠时替换旧带</div>
      </div>
    </div>`;
  main.appendChild(panel);
  const pc = panel.querySelector("#fx-c"), pd = panel.querySelector("#fx-d"),
        ps = panel.querySelector("#fx-s"), po = panel.querySelector("#fx-ocr");
  pc.value = (b.params && b.params.contrast) ?? 100;
  pd.value = (b.params && b.params.denoise) ?? 0;
  ps.value = (b.params && b.params.sharpen) ?? 0;
  po.value = (b.params && b.params.ocr && b.params.ocr.engine) || "textlayer";
  let bands = ((await api(`/api/books/${encodeURIComponent(id)}/regions`)).bands ?? []).slice();
  let drawMode = false, drawStart = null, ghost = null;
  const showSamples = (j) => {
    panel.querySelector("#fx-samples").innerHTML = j.samples.map((s) =>
      `<div class="bandwrap" style="flex:none"><div style="position:relative;display:inline-block"><img src="${s.src}" style="height:min(56vh,520px);display:block;border:1px solid var(--line)"><div class="bands" style="position:absolute;inset:0"></div></div><div style="font-size:11px;color:var(--dim);text-align:center;margin-top:4px">p${s.page}</div></div>`).join("");
    drawBands();
  };
  const drawBands = () => {
    panel.querySelectorAll(".bands").forEach((el) => {
      el.innerHTML = "";
      const all = ghost ? bands.concat([ghost]) : bands.slice();
      for (const bd of all) {
        const o = document.createElement("div");
        o.style.cssText = `position:absolute;left:0;right:0;top:${bd.y0 * 100}%;height:${(bd.y1 - bd.y0) * 100}%;pointer-events:none;background:${bd.kind === "footer" ? "rgba(74,124,89,.25)" : bd.kind === "header" ? "rgba(180,85,45,.25)" : "rgba(42,42,40,.14)"};border-top:1.5px dashed ${bd.kind === "footer" ? "#4a7c59" : "#b4552d"};border-bottom:1.5px dashed ${bd.kind === "footer" ? "#4a7c59" : "#b4552d"}`;
        el.appendChild(o);
      }
    });
    renderBandList();
  };
  const renderBandList = () => { // 已标横带列表：可删；重叠的新带会替换旧带，这里让人看得见现状
    const host = panel.querySelector("#band-list");
    if (!host) return;
    if (!bands.length) { host.innerHTML = "<span style='color:var(--dim)'>尚无</span>"; return; }
    host.innerHTML = bands.map((bd, i) =>
      `<div style="display:flex;align-items:center;gap:8px">
        <span style="color:${bd.kind === "footer" ? "#4a7c59" : "#b4552d"};width:34px">${bd.kind === "footer" ? "页脚" : "页眉"}</span>
        <span style="flex:1">${Math.round(bd.y0 * 100)}% – ${Math.round(bd.y1 * 100)}%</span>
        <button class="ta" data-del="${i}" style="color:#a8322a">✕</button></div>`).join("");
    host.querySelectorAll("[data-del]").forEach((btn) => {
      btn.onclick = () => { bands.splice(Number(btn.dataset.del), 1); drawBands(); };
    });
  };
  let bandPopup = null, popupHooks = null;
  const closeBandPopup = () => {
    if (popupHooks) {
      document.removeEventListener("pointerdown", popupHooks.onDoc, true);
      document.removeEventListener("keydown", popupHooks.onKey);
      popupHooks = null;
    }
    if (bandPopup) { bandPopup.remove(); bandPopup = null; }
    ghost = null;
    drawBands();
  };
  const loadSamples = async () => {
    const host = panel.querySelector("#fx-samples");
    host.innerHTML = `<div style="color:var(--dim);font-size:12.5px">渲染采样…</div>`;
    const q = new URLSearchParams({ pct: "5,30,55,80" });
    try {
      const r = await fetch(`/api/books/${encodeURIComponent(id)}/samples?` + q);
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      showSamples(j);
    } catch (e) {
      host.innerHTML = `<div style="color:#a8322a;font-size:12.5px">采样失败 —— ${esc(e.message)}</div>`;
    }
  };
  let debounce = null;
  const liveRefresh = () => {
    panel.querySelector("#fx-cv").textContent = pc.value;
    panel.querySelector("#fx-dv").textContent = pd.value;
    panel.querySelector("#fx-sv").textContent = ps.value;
    clearTimeout(debounce);
    debounce = setTimeout(loadSamples, 350); // 拖拽即时刷新（防抖）
  };
  [pc, pd, ps].forEach((el) => el.addEventListener("input", liveRefresh));
  liveRefresh();
  panel.querySelector("#fx-refresh").onclick = loadSamples;
  panel.querySelector("#fx-draw").onclick = () => {
    drawMode = !drawMode;
    panel.querySelector("#fx-draw").classList.toggle("acc", drawMode);
    if (!drawMode) closeBandPopup();
    toast(drawMode ? "在采样图上纵向拖一条横带" : "已退出标区域");
  };
  const samplesEl = panel.querySelector("#fx-samples");
  samplesEl.addEventListener("pointerdown", (e) => {
    if (!drawMode) return;
    const wrap = e.target.closest(".bandwrap");
    if (!wrap) return;
    const rect = wrap.querySelector("img").getBoundingClientRect();
    drawStart = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    const move = (ev) => {
      const y = Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height));
      ghost = { kind: "", y0: Math.min(drawStart, y), y1: Math.max(drawStart, y) };
      drawBands();
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      drawStart = null;
      if (ghost && ghost.y1 - ghost.y0 < 0.005) { ghost = null; drawBands(); return; }
      drawBands();
      if (!ghost) return;
      const band = ghost; // 保留显示；去留由弹窗决定
      closeBandPopup(); // 全局只留一个弹窗，并清掉上一轮
      ghost = band;
      drawBands();
      const mid = (band.y0 + band.y1) / 2 * rect.height + rect.top;
      bandPopup = document.createElement("div");
      bandPopup.setAttribute("data-bandpop", "");
      bandPopup.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:" + Math.max(60, mid - 20) + "px;z-index:60;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:flex;gap:14px";
      bandPopup.innerHTML = `<button class="ta" data-k="header">这条是页眉</button><button class="ta" data-k="footer">这条是页脚</button><button class="ta" data-k="x">取消</button>`;
      document.body.appendChild(bandPopup);
      bandPopup.querySelectorAll("button").forEach((b) => b.onclick = () => {
        if (b.dataset.k !== "x") {
          band.kind = b.dataset.k;
          // 重叠替换：新带与旧带纵向相交即视为同一区域的重新标注，旧带移除
          for (let i = bands.length - 1; i >= 0; i--)
            if (bands[i].y0 < band.y1 && bands[i].y1 > band.y0) bands.splice(i, 1);
          bands.push(band);
        }
        closeBandPopup();
      });
      const onDoc = (ev) => { if (bandPopup && !bandPopup.contains(ev.target)) closeBandPopup(); };
      const onKey = (ev) => { if (ev.key === "Escape") closeBandPopup(); };
      document.addEventListener("pointerdown", onDoc, true);
      document.addEventListener("keydown", onKey);
      popupHooks = { onDoc, onKey };
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
  panel.querySelector("#fx-confirm").onclick = async () => {
    // 三步都是"落定"语义，失败原地可重试；失败时面板留着，成功才整页刷新
    try {
      await api(`/api/books/${encodeURIComponent(id)}/regions`, { bands });
      await api(`/api/books/${encodeURIComponent(id)}/params`, {
        contrast: Number(pc.value) || 100, denoise: Number(pd.value) || 0, sharpen: Number(ps.value) || 0,
        ocr: { engine: po.value },
      });
      await api(`/api/books/${encodeURIComponent(id)}/preprocess/confirm`, {});
      renderBook(id);
    } catch (e) { toast(e.message); }
  };
}

// ---------- 识别来源选择：书籍自带文本层 / 云端 / 本地 ----------
async function openOcrPick(id) {
  const det = await fetch(`/api/books/${encodeURIComponent(id)}/textlayer`)
    .then((r) => r.json())
    .catch((e) => { console.warn("文本层探测失败（按有文本层放行）——", e); return { hasText: true }; });
  let panel = document.getElementById("ocrpick");
  if (panel) panel.remove();
  panel = $(`<div id="ocrpick" style="position:fixed;inset:0;background:rgba(42,42,40,.35);z-index:50">
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--paper);border:1px solid var(--line);width:min(420px,92vw);padding:22px 26px">
      <h3 style="font-size:15px;margin:0 0 14px">识别来源</h3>
      <label style="display:flex;gap:10px;align-items:baseline;padding:8px 0;cursor:pointer">
        <input type="radio" name="ocrsrc" value="textlayer" ${det.hasText ? "checked" : "disabled"}>
        <span style="font-size:14px">书籍自带文本层${det.hasText ? "" : "（未检测到文本层）"}</span></label>
      <label style="display:flex;gap:10px;align-items:baseline;padding:8px 0;color:var(--dim)">
        <input type="radio" name="ocrsrc" value="cloud" disabled>
        <span style="font-size:14px">云端 OCR（未点亮）</span></label>
      <label style="display:flex;gap:10px;align-items:baseline;padding:8px 0;color:var(--dim)">
        <input type="radio" name="ocrsrc" value="local" disabled>
        <span style="font-size:14px">本地 OCR（未点亮）</span></label>
      <div class="row" style="justify-content:flex-end;margin-top:16px">
        <button class="ta" id="ocr-cancel">取消</button>
        <button class="ta acc" id="ocr-go">开始识别</button>
      </div></div></div>`);
  document.body.appendChild(panel);
  panel.querySelector("#ocr-cancel").onclick = () => panel.remove();
  panel.querySelector("#ocr-go").onclick = async () => {
    const eng = panel.querySelector('input[name=ocrsrc]:checked');
    if (!eng) return;
    try {
      const p0 = await api(`/api/books/${encodeURIComponent(id)}/params`);
      await api(`/api/books/${encodeURIComponent(id)}/params`, {
        contrast: p0.contrast, denoise: p0.denoise, sharpen: p0.sharpen, ocr: { engine: eng.value },
      });
      panel.remove();
      await api(`/api/books/${encodeURIComponent(id)}/tasks`, { behavior: "process" });
      renderBook(id);
    } catch (e) { toast(e.message); }
  };
}

// ---------- 删除书籍（软删除：数据不动，两次确认，只在书详情页） ----------
async function deleteBook(id) {
  await api(`/api/books/${encodeURIComponent(id)}/delete`, {});
  toast("已删除（数据保留）");
  location.hash = "";
}

// ---------- 能力配置（功能层级：OCR 云端/本地、LLM） ----------
const CFG_FIELDS = [
  ["c-ocrcloud-url", "ocr.cloud.url"], ["c-ocrcloud-key", "ocr.cloud.key"], ["c-ocrcloud-model", "ocr.cloud.model"],
  ["c-ocrlocal-engine", "ocr.local.engine"],
  ["c-llm-url", "llm.api.url"], ["c-llm-key", "llm.api.key"], ["c-llm-model", "llm.api.model"],
];
const cfgEl = document.getElementById("cfg");
document.getElementById("cfgBtn").onclick = async () => {
  try {
    const c = await api("/api/config");
    for (const [fid, path] of CFG_FIELDS) {
      const seg = path.split(".");
      document.getElementById(fid).value = (c[seg[0]]?.[seg[1]]?.[seg[2]] ?? "");
    }
    cfgEl.style.display = "block";
  } catch (e) { toast(e.message); }
};
document.getElementById("cfgClose").onclick = () => (cfgEl.style.display = "none");
document.getElementById("cfgSave").onclick = async () => {
  try {
    const c = await api("/api/config");
    for (const [fid, path] of CFG_FIELDS) {
      const seg = path.split(".");
      c[seg[0]] ??= {}; c[seg[0]][seg[1]] ??= {};
      c[seg[0]][seg[1]][seg[2]] = document.getElementById(fid).value.trim();
    }
    await api("/api/config", c);
    toast("已保存");
    cfgEl.style.display = "none";
  } catch (e) { toast(e.message); }
};

async function boot() {
  const home = await api("/api/home");
  if (!home.configured) {
    document.getElementById("cfgBtn").style.display = "none";
    const main = document.getElementById("main");
    main.innerHTML = "";
    const p = $(`<div class="panel" style="max-width:560px">
      <h2 style="font-size:15px;margin:0 0 14px">存储位置</h2>
      <div class="row">
        <input type="text" id="h-path" style="flex:1;padding:6px 9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px" value="${esc(home.libraryRoot)}">
        <button class="ta acc" id="h-go">确定</button>
      </div></div>`);
    main.appendChild(p);
    p.querySelector("#h-go").onclick = async () => {
      try {
        await api("/api/home", { path: p.querySelector("#h-path").value });
        document.getElementById("cfgBtn").style.display = "";
        route();
      } catch (e) { toast(e.message); }
    };
    return;
  }
  route();
}
boot();
</script>
