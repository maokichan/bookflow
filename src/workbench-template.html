<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>bookflow 工作台</title>
<style>
  :root {
    --ink: #2a2a28; --paper: #faf9f6; --desk: #e3dfd4; --line: #d8d4cc; --dim: #8a857c;
    --accent: #b4552d; --ok: #4a7c59; --hl: rgba(180, 85, 45, .18); --hair: #e8e4da;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--ink);
    font-family: "Times New Roman", "Noto Serif SC", "SimSun", serif; font-size: 15px; }
  button { font: inherit; background: none; border: none; color: var(--ink); cursor: pointer; padding: 0; }
  .ta { font-size: 13px; font-weight: 700; }
  .ta:hover { color: var(--accent); }

  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 36px; z-index: 20;
    display: flex; align-items: center; gap: 16px; padding: 0 16px;
    background: var(--paper); border-bottom: 1px solid var(--line); }
  #topbar h1 { font-size: 14px; margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #topbar .sp { flex: 1; }
  #topbar .count { font-size: 12.5px; color: var(--dim); white-space: nowrap; }

  /* 挂载线：左右两栏挂在线上，点线上的字收放 */
  /* 挂载线：左右两栏挂在线上，点线上的字收放；字的显隐反映开合态（开=在，合=淡） */
  .railtab { position: fixed; top: 36px; z-index: 21; height: 26px; line-height: 26px;
    font-size: 12.5px; color: var(--ink); opacity: .38; padding: 0 14px; background: var(--desk); }
  .railtab:hover { opacity: 1; }
  body:not(.noL) #tabL, body:not(.noR) #tabR { opacity: .82; }
  #tabL { left: 0; border-right: 1px solid var(--line); }
  #tabR { right: 0; border-left: 1px solid var(--line); }

  .rail { position: fixed; top: 62px; bottom: 0; width: 252px; z-index: 15;
    background: var(--desk); overflow-y: auto; padding: 10px 12px 120px; }
  body.noL #leftrail, body.noR #rightrail { display: none; }
  body #center { position: fixed; top: 36px; bottom: 0; left: 0; right: 0; overflow-y: auto; }
  body:not(.noL) #center { left: 252px; }
  body:not(.noR) #center { right: 252px; }

  #leftrail { left: 0; border-right: 1px solid var(--line); }
  #rightrail { right: 0; border-left: 1px solid var(--line); }
  .rail .rh { font-size: 11.5px; color: var(--dim); margin: 4px 0 8px; font-family: ui-monospace, Consolas, monospace; }
  /* 滚动条：只写 ::-webkit-scrollbar，绝不写 scrollbar-width/scrollbar-color ——
     Chromium 121+ 起写了标准属性，webkit 规则会被整个忽略（TuRead STYLE.md 实测的坑）。
     静息低存在感，指针悬上去才加深 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(42,42,40,.12); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(42,42,40,.28); }
  #center::-webkit-scrollbar, .rail::-webkit-scrollbar, #curcard .ctxt::-webkit-scrollbar { width: 6px; height: 6px; }
  #center::-webkit-scrollbar-thumb, .rail::-webkit-scrollbar-thumb, #curcard .ctxt::-webkit-scrollbar-thumb { border-radius: 3px; }
  .ol-item { font-size: 13px; padding: 3px 6px; cursor: pointer; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ol-item.lv1 { padding-left: 6px; }
  .ol-item.lv2 { padding-left: 28px; border-left: 1px solid var(--hair); margin-left: 10px; }
  .ol-item.lv3 { padding-left: 50px; border-left: 1px solid var(--hair); margin-left: 32px; }
  .mt-item { font-size: 13.5px; line-height: 1.9; padding: 9px 4px; border-bottom: 1px solid var(--hair); cursor: pointer; color: #3a372f; }
  .mt-item:hover { background: var(--paper); }
  .mt-item.mt-h { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .ol-item:hover { background: var(--paper); }

  .ol-item .opg { float: right; color: var(--dim); font-size: 11px; }
  .ol-empty { font-size: 12.5px; color: var(--dim); }
  .dn-item { font-size: 13px; line-height: 1.6; padding: 6px 6px; border-bottom: 1px solid var(--hair); color: #57534a; }
  .dn-item .dmeta { font-size: 10.5px; color: var(--dim); font-family: ui-monospace, Consolas, monospace; }
  .dn-item .dtxt { max-height: 3.2em; overflow: hidden; }

  .pagebox { position: relative; margin: 18px auto; width: fit-content; font-size: 0;
    box-shadow: 0 1px 5px rgba(0,0,0,.22); background: #fff; }
  .pagebox img { display: block; user-select: none; }
  .bbox { position: absolute; inset: 0; pointer-events: none; display: none; }
  .brect { position: absolute; border: 2px solid var(--accent); background: var(--hl); border-radius: 2px; }
  .brect.next { border: 1.5px dashed #4a7c59; background: rgba(74,124,89,.10); } /* 下一可拼合块的预览框 */
  .drawrect { position: absolute; border: 1.5px dashed var(--accent); background: var(--hl); pointer-events: none; }
  body.assetmode #center { cursor: crosshair; }
  .imgfail { color: #a8322a; font: 13px sans-serif; padding: 12px; }

  /* 当前裁决条目：底部居中，圆角容器，作为焦点存在 */
  #curcard { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 30;
    width: min(920px, calc(100vw - 56px)); background: var(--paper); border: 1px solid var(--ink);
    border-radius: 10px; padding: 10px 16px 8px; }
  #curcard.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--hl); }
  #curcard .cmeta { font-size: 11px; color: var(--dim); font-family: ui-monospace, Consolas, monospace;
    display: flex; gap: 10px; }
  #curcard .cmeta .sp { flex: 1; }
  #curcard .ctxt { font-size: 15px; line-height: 1.75; white-space: pre-wrap; outline: none;
    max-height: 9.5em; overflow-y: auto; margin: 4px 0 6px; }
  #curcard .ctxt[contenteditable="true"] { background: #fffbe8; }
  #curcard .cacts { display: flex; gap: 14px; border-top: 1px solid var(--hair); padding-top: 5px; }
  #curcard .cacts .ta { color: #57534a; }
  #curcard .cacts .ta:hover { color: var(--accent); }
  #curcard .cacts .sp { flex: 1; }
  #curcard:not(.editing) .edit-only { display: none; }
  #curcard.editing .edit-hide { display: none; }

  #modebar { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); z-index: 40;
    background: var(--ink); color: #fff; padding: 6px 18px; border-radius: 4px; display: none; font-size: 14px; }
  #toast { position: fixed; bottom: 18px; right: 18px; z-index: 50; display: none;
    background: var(--ok); color: #fff; padding: 6px 16px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div id="topbar">
  <button class="ta" onclick="window.close();location.href='/';">‹ 书架</button>
  <h1 id="title"></h1>
  <span class="sp"></span>
  <span class="count" id="counts"></span>
</div>
<button class="railtab" id="tabL" aria-pressed="true">结构</button>
<button class="railtab" id="tabR" aria-pressed="true">已定</button>
<div class="rail" id="leftrail"></div>
<div class="rail" id="rightrail"></div>
<div id="center"><div id="pages"></div></div>
<div id="curcard">
  <div class="cmeta"><span id="cid"></span><span id="ctype"></span><span class="sp"></span><span id="cmerge" style="color:var(--accent)"></span><span id="ccount"></span></div>
  <div class="ctxt" id="ctext"></div>
  <div class="cacts">
    <button class="ta edit-hide" data-k="g">盖章 G</button>
    <button class="ta edit-hide" data-k="e">改文 E</button>
    <button class="ta edit-hide" data-k="h">结构 H</button>
    <button class="ta edit-hide" data-k="t">改型 T</button>
    <button class="ta edit-hide" data-k="m">拼合 M</button>
    <button class="ta edit-hide" data-k="a">标素材 A</button>
    <button class="ta edit-hide" data-k="undo">撤销</button>
    <button class="ta edit-hide" data-k="redo">重做</button>
    <span class="sp"></span>
    <button class="ta edit-hide" data-k="kup">↑ J</button>
    <button class="ta edit-hide" data-k="kdn">↓ K</button>
    <button class="ta edit-only" data-k="n">插注 N</button>
    <button class="ta edit-only" data-k="enter">完成 ↵</button>
  </div>
</div>
<div id="modebar"></div>
<div id="toast"></div>
<script>
"use strict";
/*__DATA__*/null;
// ===== 状态 =====
var TYPES = ["flow", "structure", "furniture", "annotation", "asset", "untyped"];
var state = { idx: 0, log: [], zoomFit: true, editing: false, typeMode: false, levelMode: false, assetMode: false, undoStack: [], redoStack: [], focus: null };
try {
  var mirrored = JSON.parse(localStorage.getItem(logKey()) || "[]");
  if (mirrored.length) { state.log = mirrored; toast("检测到 " + mirrored.length + " 条未落盘裁决，请先导出"); }
} catch (e) { console.warn("本地镜像裁决日志读不出（忽略）——", e); }
function logKey() { return "bookflow:log:" + (DATA.bookId || DATA.title); } // 键跟书号：同名片不串日志（旧产物无 bookId 回退书名）

// 待校队列 = 非附着、非素材块中仍为 typed 且未被吸收的，按书序；右侧栏 = 已定，逐渐成型的书
function queue() {
  var arr = [];
  for (var i = 0; i < DATA.blocks.length; i++) {
    var b = DATA.blocks[i];
    if (b.state === "typed" && b.type !== "furniture" && b.type !== "asset" && !b.absorbedInto) arr.push(b);
  }
  return arr;
}
function doneBlocks() {
  return DATA.blocks.filter(function (b) { return b.state === "原文已定"; });
}
function cur() { return state.focus || queue()[state.idx] || null; } // 焦点块（左右栏点选）优先于队列游标
function pageSrc(p) { return PAGES_BASE + "p" + String(p).padStart(3, "0") + ".png"; }

// ===== 动作 =====
// 每条裁决入日志的同时备好逆动作；撤销/重做本身也是日志条目（append-only 不破，
// 回放器按同规则消费 unmerge/undeclare/reclassify 带层级清除）。
function blockById(id) { return DATA.blocks.find(function (b) { return b.id === id; }); }
function computeInverse(action, block, payload) {
  if (action === "gate") return { action: "gate", blockId: block.id, payload: { state: block.state } };
  if (action === "edit") return { action: "edit", blockId: block.id, payload: { text: block.text } };
  if (action === "reclassify" || action === "structure")
    return { action: "reclassify", blockId: block.id,
      payload: { type: block.type, level: block.level ?? null, role: block.role ?? null } };
  if (action === "merge")
    return { action: "unmerge", blockId: block.id,
      payload: { absorb: payload.absorb, text: block.text,
        bbox: { x0: block.bbox.x0, y0: block.bbox.y0, x1: block.bbox.x1, y1: block.bbox.y1 } } };
  if (action === "declare") return { action: "undeclare", blockId: block.id, payload: {} };
  return null;
}
function applyEntry(action, block, payload) {
  if (action === "gate") block.state = payload.state;
  else if (action === "edit") block.text = payload.text;
  else if (action === "reclassify") {
    block.type = payload.type;
    if (payload.level !== undefined) block.level = payload.level ?? undefined; // null = 清除
    if (payload.role !== undefined) block.role = payload.role ?? undefined;
  }
  else if (action === "structure") { block.type = "structure"; block.level = payload.level; block.role = payload.role; }
  else if (action === "merge") {
    var m = blockById(payload.absorb);
    if (m) {
      block.text = joinPara(block.text, m.text);
      // 同页拼合框并为一个；跨页保持页局部，附属框由显示层补画
      if (block.page === m.page)
        block.bbox = { x0: Math.min(block.bbox.x0, m.bbox.x0), y0: Math.min(block.bbox.y0, m.bbox.y0),
                       x1: Math.max(block.bbox.x1, m.bbox.x1), y1: Math.max(block.bbox.y1, m.bbox.y1) };
      m.absorbedInto = block.id;
    }
  }
  else if (action === "unmerge") {
    var m2 = blockById(payload.absorb);
    if (m2 && m2.absorbedInto === block.id) { block.text = payload.text; block.bbox = payload.bbox; m2.absorbedInto = undefined; }
  }
  else if (action === "declare") {
    var nb = payload.block;
    if (nb && !blockById(nb.id)) {
      var at = DATA.blocks.length; // 书序插入：页码优先，同页按 y0（与回放器同规则）
      for (var i = 0; i < DATA.blocks.length; i++) {
        var x = DATA.blocks[i];
        if (x.page > nb.page || (x.page === nb.page && x.bbox.y0 > nb.bbox.y0)) { at = i; break; }
      }
      DATA.blocks.splice(at, 0, nb);
    }
  }
  else if (action === "undeclare") {
    if (block.state === "typed" && !DATA.blocks.some(function (x) { return x.absorbedInto === block.id; }))
      DATA.blocks.splice(DATA.blocks.indexOf(block), 1);
  }
}
function applyAndLog(action, block, payload) {
  applyEntry(action, block, payload);
  state.log.push({ ts: new Date().toISOString(), block: block.id, action: action, payload: payload });
  localStorage.setItem(logKey(), JSON.stringify(state.log));
  renderChrome();
  if (state.log.length >= 15) { toast("已满 15 条，自动导出"); exportLog(); }
}
// 撤销/重做栈持久化：刷新或隔天回来仍能反悔最近的裁决（块不在图里时栈自动清空兜底）
function saveUndo() {
  try { localStorage.setItem(logKey() + ":undo", JSON.stringify({ u: state.undoStack, r: state.redoStack })); }
  catch (e) { console.warn("撤销栈落 localstorage 失败（忽略）——", e); }
}
function loadUndo() {
  try {
    var j = JSON.parse(localStorage.getItem(logKey() + ":undo") || "null");
    if (j) { state.undoStack = j.u || []; state.redoStack = j.r || []; }
  } catch (e) { console.warn("撤销栈读不出（忽略）——", e); }
}
function push(action, block, payload) {
  var inverse = computeInverse(action, block, payload);
  applyAndLog(action, block, payload);
  if (inverse) { state.undoStack.push(inverse); state.redoStack = []; saveUndo(); }
}
function doUndo() {
  if (state.editing) return;
  var u = state.undoStack.pop();
  if (!u) { toast("没有可撤销的裁决"); return; }
  var b = blockById(u.blockId);
  if (!b) { state.undoStack = []; saveUndo(); toast("块 " + u.blockId + " 已不在图中，撤销栈已清"); return; }
  applyAndLog(u.action, b, u.payload);
  state.redoStack.push(u);
  saveUndo();
  renderAll();
  toast("已撤销：" + u.action);
}
function doRedo() {
  if (state.editing) return;
  var r = state.redoStack.pop();
  if (!r) { toast("没有可重做的裁决"); return; }
  var b = blockById(r.blockId);
  if (!b) { state.redoStack = []; saveUndo(); toast("块 " + r.blockId + " 已不在图中，重做栈已清"); return; }
  applyAndLog(r.action, b, r.payload);
  state.undoStack.push(r);
  saveUndo();
  renderAll();
  toast("已重做：" + r.action);
}
// 镜像日志重放（与回放器同规则，非法则跳过）
function replayMirror() {
  var allowed = { typed: ["原文已定"], "原文已定": ["typed"] };
  for (var i = 0; i < state.log.length; i++) {
    var a = state.log[i];
    var b = DATA.blocks.find(function (x) { return x.id === a.block; });
    if (a.action === "declare") {
      var nb = a.payload && a.payload.block;
      if (nb && nb.type === "asset" && nb.state === "typed" && !blockById(nb.id)) applyEntry("declare", null, a.payload);
      continue;
    }
    if (!b) continue;
    if (a.action === "gate") {
      var ok = (allowed[b.state] || []).indexOf(a.payload.state) >= 0;
      if (ok) b.state = a.payload.state;
    } else if (a.action === "edit") b.text = a.payload.text;
    else if (a.action === "reclassify") applyEntry("reclassify", b, a.payload);
    else if (a.action === "structure") { b.type = "structure"; b.level = a.payload.level; b.role = a.payload.role; }
    else if (a.action === "merge") {
      var m = blockById(a.payload.absorb);
      if (m && !m.absorbedInto) applyEntry("merge", b, a.payload);
    }
    else if (a.action === "unmerge") applyEntry("unmerge", b, a.payload);
    else if (a.action === "undeclare") applyEntry("undeclare", b, a.payload);
  }
}

// ===== 渲染 =====
function renderAll() { renderChrome(); renderOutline(); renderCurrent(); renderDone(); }
function renderChrome() {
  var q = queue(), d = doneBlocks();
  document.getElementById("counts").textContent = "待校 " + q.length + " · 已定 " + d.length;
  document.getElementById("tabR").textContent = "已定 · " + d.length;
  document.getElementById("tabL").textContent = "结构 · " + DATA.blocks.filter(function (b) { return b.type === "structure" && b.level; }).length;
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function placeCaretEnd(el) {
  var r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
  var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
function renderCurrent() {
  var q = queue();
  if (state.idx >= q.length) state.idx = Math.max(0, q.length - 1);
  var b = cur();
  var card = document.getElementById("curcard");
  var cmeta = document.getElementById("cmerge");
  cmeta.textContent = "";
  if (!b) {
    document.getElementById("cid").textContent = "—";
    document.getElementById("ctype").textContent = "本队列已清";
    document.getElementById("ccount").textContent = "";
    var ct = document.getElementById("ctext");
    ct.textContent = ""; ct.removeAttribute("contenteditable");
    card.classList.remove("editing");
  } else {
    document.getElementById("cid").textContent = b.id;
    document.getElementById("ctype").textContent = b.type + (b.role ? " " + b.role : "") + (b.level ? " L" + b.level : "") + " · " + b.state + (state.focus ? " · 焦点" : "");
    document.getElementById("ccount").textContent = state.focus ? "Esc 回队列" : (state.idx + 1) + " / " + q.length;
    // 拼合现状 + 拼合预览：按 M 之前就知道会拼进什么
    var mine = absorbedBy(b), next = nextMergeable(b);
    var parts = [];
    if (mine.length) parts.push("已拼 " + mine.length + " 块（Ctrl+Z 逐块拆开）");
    if (next) parts.push("下块 " + next.id + "「" + next.text.slice(0, 14) + "…」 M 拼入");
    if (parts.length) cmeta.textContent = parts.join(" · ");
    var ct2 = document.getElementById("ctext");
    ct2.textContent = b.text;
    if (state.editing) { ct2.setAttribute("contenteditable", "true"); card.classList.add("editing"); placeCaretEnd(ct2); }
    else { ct2.removeAttribute("contenteditable"); card.classList.remove("editing"); }
  }
  updateSelection();
  centerSelection();
}
function renderDone() {
  var d = doneBlocks(); // 书序即数组序
  var host = document.getElementById("rightrail");
  if (!d.length) { host.innerHTML = "<div class='rh'>OCR 产物</div><div class='ol-empty'>尚无已定段落</div>"; return; }
  var html = "";
  for (var i = 0; i < d.length; i++) {
    var b = d[i];
    var full = state.mtFull !== false;
    var txt = full || b.text.length <= 90 ? b.text : b.text.slice(0, 90) + "…";
    var cls = b.type === "structure" ? " mt-h" : "";
    html += "<div class='mt-item" + cls + "' data-id='" + b.id + "' data-page='" + b.page + "' data-y='" + b.bbox.y0 + "'>" + esc(txt) + "</div>";
  }
  host.innerHTML = "<div class='rh'>OCR 产物 · <button class='ta' id='mt-toggle'>" + (state.mtFull !== false ? "节选" : "全量") + "</button></div>" + html;
}

// ===== 大纲（左栏：结构树即导航；计数 = 归属到该结构的块数） =====
function renderOutline() {
  var host = document.getElementById("leftrail");
  var own = owners();
  var items = [], counts = {};
  for (var i = 0; i < DATA.blocks.length; i++) {
    var b = DATA.blocks[i];
    if (b.type === "structure") items.push(b);
    if (own[b.id] && b.id !== own[b.id]) counts[own[b.id]] = (counts[own[b.id]] ?? 0) + 1;
  }
  items.sort(function (x, y) { return x.page - y.page || x.bbox.y0 - y.bbox.y0; });
  if (!items.length) { host.innerHTML = "<div class='rh'>结构</div><div class='ol-empty'>空 —— 选中标题块按 H 标层级</div>"; return; }
  var html = "";
  for (var j = 0; j < items.length; j++) {
    var t = items[j];
    html += "<div class='ol-item lv" + Math.max(1, t.level || 1) + "' data-id='" + t.id + "'>"
      + esc(t.text.slice(0, 20)) + "<span class='opg'>" + t.page + " · " + (counts[t.id] ?? 0) + "块</span></div>";
  }
  host.innerHTML = "<div class='rh'>结构 · 括号内为归属块数</div>" + html;
}

// ===== 动作实现 =====
function doGate(back) {
  var b = cur(); if (!b) return;
  var target = back ? "typed" : "原文已定";
  if (!back && b.state !== "typed") { toast("仅 待校 块可盖章"); return; }
  if (back && b.state !== "原文已定") { toast("仅 已定 块可退回"); return; }
  push("gate", b, { state: target });
  toast(back ? "已退回" : "已盖章 " + b.id);
  renderAll();
}
function doReclassify(n) {
  var b = cur(); if (!b) return;
  var t = TYPES[n - 1]; if (!t) return;
  push("reclassify", b, { type: t });

}

// ===== 手感：跨页拼合（声明式吸收，守恒不破） =====
function joinPara(a, b) {
  var c = (a || "").replace(/\s+$/, ""), d = (b || "").replace(/^\s+/, "");
  if (!c) return d; if (!d) return c;
  var cjkL = /[\u3000-\u9fff\uf900-\ufaff\u3040-\u30ff。，、；：？！）》」』】〉”’%)]/.test(c.slice(-1));
  var cjkR = /[\u3000-\u9fff\uf900-\ufaff\u3040-\u30ff《「『【〈“‘(（]/.test(d[0]);
  return (cjkL || cjkR) ? c + d : c + " " + d;
}
// 与 doMerge 同一判定的"下一可拼合块"：页图上画虚线框预览，M 之前看得见要拼什么
function nextMergeable(b) {
  if (b.type !== "flow") return null;
  var idx = DATA.blocks.indexOf(b);
  for (var i = idx + 1; i < DATA.blocks.length; i++) {
    var n = DATA.blocks[i];
    if (n.type === "furniture" || n.absorbedInto) continue;
    return (n.type === "flow" && n.state === "typed") ? n : null;
  }
  return null;
}
function doMerge() {
  var b = cur(); if (!b) return;
  var next = nextMergeable(b);
  if (!next) { toast("仅流转块可拼合，且书序下一块须为待校流转块"); return; }
  push("merge", b, { absorb: next.id });
  toast(b.id + " ⊕ " + next.id);
  renderAll(); // 拼合后的块仍是当前条目，继续审它
}

// ===== 结构辅助：角色 + 层级（封面/目录/前言…都是结构；编号模式给建议，手动为准） =====
var ROLES = ["封面", "目录", "前言", "导论", "章", "节", "目", "附录", "后记", "参考文献"];
var ROLE_LEVEL = { "封面": 0, "目录": 0, "前言": 1, "导论": 1, "章": 1, "节": 2, "目": 3, "附录": 1, "后记": 1, "参考文献": 1 };
function suggestRole(t) {
  t = (t || "").trim();
  if (!t) return null;
  for (var i = 0; i < ROLES.length; i++) {
    var r = ROLES[i];
    if (r === "章" || r === "节" || r === "目") continue;
    if (t.indexOf(r) === 0) return { role: r, level: ROLE_LEVEL[r] };
  }
  if (/^序(言|文)?|^绪论|^引言/.test(t)) return { role: "前言", level: 1 };
  if (/^(第[一二三四五六七八九十百0-9]+(章|部|编|篇))/.test(t)) return { role: "章", level: 1 };
  if (/^(Part|Chapter)\s*[0-9]/i.test(t)) return { role: "章", level: 1 };
  if (/^(第[一二三四五六七八九十百0-9]+(节|讲|回))/.test(t)) return { role: "节", level: 2 };
  if (/^[一二三四五六七八九十]+、/.test(t)) return { role: "节", level: 2 };
  if (/^\d+\.\d+(?!\.\d)/.test(t)) return { role: "节", level: 2 };
  if (/^\d+\.\d+\.\d+/.test(t)) return { role: "目", level: 3 };
  return null;
}
function showRoleSuggest() {
  var s = suggestRole(cur() ? cur().text : "");
  state.suggest = s;
  var menu = "1封面 2目录 3前言 4导论 5章 6节 7目 8附录 9后记 0参考文献";
  modebar(s ? "结构 → 回车认建议 " + s.role + " L" + s.level + " · " + menu + " （Esc 取消）"
            : "结构 → " + menu + " （Esc 取消）");
}
function doStructureRole(i) {
  var b = cur(); if (!b) return;
  var role = ROLES[i]; if (!role) return;
  push("structure", b, { role: role, level: ROLE_LEVEL[role] });
  toast(b.id + " → " + role + " L" + ROLE_LEVEL[role]);
  state.levelMode = false; modebar("");
  renderAll();
  if (cur() === b) move(1);
}

// ===== 注释符：编辑态 N 键，按本页已有标记自增 =====
function nextMarker() {
  var S = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";
  var b = cur(); if (!b) return "①";
  var max = 0;
  for (var i = 0; i < DATA.blocks.length; i++) {
    var x = DATA.blocks[i];
    if (x.page !== b.page) continue;
    var txt = (x.id === b.id && state.editing) ? document.getElementById("ctext").innerText : x.text;
    for (var j = 0; j < txt.length; j++) { var k = S.indexOf(txt[j]); if (k >= max) max = k + 1; }
  }
  return S[Math.min(max, S.length - 1)];
}
function insertAtCaret(el, s) {
  var sel = window.getSelection();
  if (!sel.rangeCount) { el.appendChild(document.createTextNode(s)); return; }
  var r = sel.getRangeAt(0);
  r.deleteContents();
  var n = document.createTextNode(s);
  r.insertNode(n);
  r.setStartAfter(n); r.setEndAfter(n);
  sel.removeAllRanges(); sel.addRange(r);
}

// ===== 归属：块按书序归入最近的前置结构节点（同页内标题线以上的自然归前节） =====
function owners() {
  var map = {}, owner = null;
  for (var i = 0; i < DATA.blocks.length; i++) {
    var b = DATA.blocks[i];
    if (b.type === "furniture") continue;
    if (b.type === "structure") { owner = b.id; map[b.id] = owner; continue; }
    if (owner) map[b.id] = owner;
  }
  return map;
}
function commitEdit() {
  var ed = document.getElementById("ctext");

// ===== 导航 =====
function move(d) {

// ===== 导出 =====
// http 源：直存服务端该书 inbox（回放器消费），服务端确认收到才清本地——
// 下载不落盘即丢裁决的坑就此关闭。file:// 源没有服务端可托付，浏览器算哈希盖信封后下载。
// 信封（书号 + 内容 sha256）让日志可被人工携走跨机：传输出错/投错收发箱在回放时当场拒收。
function sha256Hex(text) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
    var v = new Uint8Array(buf), s = "";
    for (var i = 0; i < v.length; i++) s += v[i].toString(16).padStart(2, "0");
    return s;
  });
}
function exportLog() {
  if (!state.log.length) { toast("日志为空"); return; }
  var text = state.log.map(function (a) { return JSON.stringify(a); }).join("\n") + "\n";
  if (location.origin.startsWith("http")) {
    fetch("/api/books/" + encodeURIComponent(DATA.bookId) + "/verdicts", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ text: text }),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        if (!x.ok) { toast(x.j.error || "存入被拒 —— 日志还在本地"); return; }
        state.log = [];
        localStorage.setItem(logKey(), "[]");
        renderChrome();
        toast("已存入该书 inbox —— 回书架点回放生效");
      })
      .catch(function () { toast("存入失败 —— 日志还在本地，稍后重试"); });
    return;
  }
  sha256Hex(text).then(function (hash) {
    var header = JSON.stringify({ bookflow: 1, kind: "adjudication", book: DATA.bookId || "",
      entries: state.log.length, sha256: hash });
    var blob = new Blob([header + "\n" + text], { type: "application/x-ndjson" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "adjudication-" + DATA.title + "-" + Date.now() + ".jsonl";
    document.body.appendChild(a); a.click(); a.remove();
    state.log = [];
    localStorage.setItem(logKey(), "[]");
    renderChrome();
    toast("已下载（带校验信封）—— 放入该书 inbox/ 后在书架点回放");
  });
}

// ===== 页图：连续滚动，选中块的高亮框始终居中 =====
// 框不是单框：当前块本页框 + 全书它吸收的块框（跨页拼合看得见）+ 吸收它的块框（回指）。
var PAGES = [];
function buildPages() {
  var host = document.getElementById("pages");
  var html = "";
  for (var p = 1; p <= DATA.pages.length; p++)
    html += "<div class='pagebox' data-p='" + p + "'><img loading='lazy' alt=''><div class='bbox'></div></div>";
  host.innerHTML = html;
  PAGES = [null];
  var boxes = host.querySelectorAll(".pagebox");
  for (var i = 0; i < boxes.length; i++) {
    var p = i + 1;
    var img = boxes[i].querySelector("img");
    img.onerror = (function (box) { return function () {
      if (!box.querySelector(".imgfail")) {
        var d = document.createElement("div"); d.className = "imgfail";
        d.textContent = "页图缺失 —— 回书架点「识别」";
        box.appendChild(d);
      }
    }; })(boxes[i]);
    img.onload = (function (img) { return function () { applyWidth(img.parentNode); }; })(img);
    img.src = pageSrc(p);
    PAGES.push({ box: boxes[i], img: img, bbox: boxes[i].querySelector(".bbox") });
  }
  wireAssetDraw();
}
function pageWidth(pg) {
  var nat = pg.img.naturalWidth || 748;
  return state.zoomFit ? Math.max(320, Math.min(center().clientWidth - 48, nat)) : nat;
}
function applyWidth(pg) {
  var w = pageWidth(pg);
  pg.box.style.width = w + "px";
  pg.img.style.width = w + "px";
}
function absorbedBy(b) { // 全书吸收进 b 的块（拼合链：跨页时画它们的框）
  return DATA.blocks.filter(function (x) { return x.absorbedInto === b.id; });
}
function drawRect(pg, blk, cls) { // 在页 pg 上画块 blk 的框（cls 追加样式）
  applyWidth(pg);
  var k = pg.img.clientWidth / DATA.pages[blk.page - 1].w;
  var box = document.createElement("div");
  box.className = "brect" + (cls ? " " + cls : "");
  box.style.left = blk.bbox.x0 * k - 3 + "px";
  box.style.top = blk.bbox.y0 * k - 3 + "px";
  box.style.width = (blk.bbox.x1 - blk.bbox.x0) * k + 6 + "px";
  box.style.height = (blk.bbox.y1 - blk.bbox.y0) * k + 6 + "px";
  pg.bbox.appendChild(box);
}
function updateSelection() {
  for (var i = 1; i < PAGES.length; i++) { PAGES[i].bbox.innerHTML = ""; PAGES[i].bbox.style.display = "none"; }
  var b = cur();
  if (!b) return;
  var chain = [b].concat(absorbedBy(b)); // 主块 + 链上成员，每页各画各的框
  for (var c = 0; c < chain.length; c++) {
    var blk = chain[c];
    if (PAGES[blk.page]) { drawRect(PAGES[blk.page], blk, ""); PAGES[blk.page].bbox.style.display = "block"; }
  }
  var next = nextMergeable(b); // 下一可拼合块：虚线预览，拼前看得见
  if (next && PAGES[next.page]) { drawRect(PAGES[next.page], next, "next"); PAGES[next.page].bbox.style.display = "block"; }
}
function centerSelection() {
  // 让位居中：选中块的主框对齐到「底部容器以上」可视区的中心，永不被容器盖住
  var b = cur();
  if (!(b && PAGES[b.page] && PAGES[b.page].bbox.style.display === "block")) return;
  var pane = center(), box = PAGES[b.page].bbox;
  var cardH = document.getElementById("curcard").offsetHeight + 40;
  var zoneH = Math.max(160, pane.clientHeight - 36 - cardH);
  var rel = box.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
  pane.scrollTop = Math.max(0, rel - zoneH / 2 + box.offsetHeight / 2);
}
function center() { return document.getElementById("center"); }

// ===== 标素材：A 键进入拉框模式，在页图上拖框 declare 素材块（坐标换算回 PDF 点） =====
function toggleAssetMode() {
  state.assetMode = !state.assetMode;
  document.body.classList.toggle("assetmode", state.assetMode);
  modebar(state.assetMode ? "标素材 → 在页图上拖一个框（Esc 退出）" : "");
  toast(state.assetMode ? "标素材：在页图上拖框" : "已退出标素材");
}
function wireAssetDraw() {
  var host = document.getElementById("pages");
  var sawPointer = 0; // pointerdown 已接则短窗内忽略其伴生 mousedown，防双触发
  host.addEventListener("mousedown", function (e) {
    if (Date.now() - sawPointer < 500) return;
    startAssetDrag(e);
  });
  host.addEventListener("pointerdown", function (e) {
    sawPointer = Date.now();
    startAssetDrag(e);
  });
  function startAssetDrag(e) {
    if (!state.assetMode || state.editing) return;
    var boxEl = e.target.closest(".pagebox");
    if (!boxEl) return;
    var pgNo = Number(boxEl.getAttribute("data-p"));
    var img = boxEl.querySelector("img");
    if (!img.naturalWidth) return; // 页图没加载出来，坐标无从换算
    e.preventDefault();
    var rect = img.getBoundingClientRect();
    var sx = e.clientX, sy = e.clientY;
    var ghost = document.createElement("div");
    ghost.className = "drawrect";
    boxEl.appendChild(ghost);
    var move = function (ev) {
      var x0 = Math.max(rect.left, Math.min(sx, ev.clientX)), x1 = Math.min(rect.right, Math.max(sx, ev.clientX));
      var y0 = Math.max(rect.top, Math.min(sy, ev.clientY)), y1 = Math.min(rect.bottom, Math.max(sy, ev.clientY));
      ghost.style.left = (x0 - rect.left) + "px"; ghost.style.top = (y0 - rect.top) + "px";
      ghost.style.width = (x1 - x0) + "px"; ghost.style.height = (y1 - y0) + "px";
    };
    var up = function (ev) {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      var x0 = Math.max(rect.left, Math.min(sx, ev.clientX)), x1 = Math.min(rect.right, Math.max(sx, ev.clientX));
      var y0 = Math.max(rect.top, Math.min(sy, ev.clientY)), y1 = Math.min(rect.bottom, Math.max(sy, ev.clientY));
      ghost.remove();
      var k = DATA.pages[pgNo - 1].w / img.clientWidth; // 显示像素 → PDF 点
      var bb = { x0: (x0 - rect.left) * k, y0: (y0 - rect.top) * k, x1: (x1 - rect.left) * k, y1: (y1 - rect.top) * k };
      if (bb.x1 - bb.x0 < 8 || bb.y1 - bb.y0 < 8) return; // 手抖级小框不算
      declareAsset(pgNo, bb);
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  }
}
function declareAsset(page, bb) {
  var seq = 0, base = "p" + String(page).padStart(2, "0") + "-a";
  while (blockById(base + String(seq).padStart(3, "0"))) seq++;
  var nb = { id: base + String(seq).padStart(3, "0"), page: page, bbox: bb, type: "asset", state: "typed",
    text: "", bold: false, findings: [], history: [] };
  push("declare", nb, { block: nb }); // computeInverse 对 declare 给 undeclare
  toggleAssetMode(); // 单发语义：标完一个框即退出，不留模式残留
  toast("素材块 " + nb.id + " 已入块图（Ctrl+Z 可撤）");
  renderAll();
}

// ===== 版本：Ctrl+S 显式存版（走本地服务；file:// 下退化为导出日志） =====

  // baseVersion 对账：块图已被回放/恢复推进时服务端拒收陈旧产物（409）——本地裁决不丢，可导出日志走回放
  var graph = { version: DATA.graphVersion ?? 0, source: DATA.source, title: DATA.title, createdAt: DATA.createdAt, pages: DATA.pages, blocks: DATA.blocks };

    .then(function (x) {
      if (!x.ok) { toast(x.j.error || "保存被拒"); return; }
      DATA.graphVersion = x.j.graphVersion; // 保存成功后本地基线跟进，可继续存版
      state.log = [];
      localStorage.setItem(logKey(), "[]");

      toast("已保存 v" + x.j.v);
    })

}

document.addEventListener("keydown", function (e) {

  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {

  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "y" || e.key === "Y")) {

    if (e.key === "Enter") { e.preventDefault(); commitEdit(); }
    else if (e.key === "Escape") { state.editing = false; renderAll(); }
    else if (/^n$/i.test(e.key) && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      insertAtCaret(document.getElementById("ctext"), nextMarker());
    }
    return;
  }
  if (state.typeMode) {
    if (e.key >= "1" && e.key <= "6") { e.preventDefault(); doReclassify(Number(e.key)); }
    else if (e.key === "Escape") { state.typeMode = false; modebar(""); }
    return;
  }
  if (state.levelMode) {
    if (e.key === "Enter" && state.suggest) { e.preventDefault(); doStructureRole(ROLES.indexOf(state.suggest.role)); }
    else if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      var i = e.key === "0" ? 9 : Number(e.key) - 1;
      doStructureRole(i);
    }
    else if (e.key === "Escape") { state.levelMode = false; modebar(""); }
    return;
  }
  var key = e.key.length === 1 ? e.key.toLowerCase() : e.key; // 快捷键不挑大小写：大写锁定/ Shift 误按同键
  if (state.focus && key === "Escape") { state.focus = null; renderAll(); return; } // 焦点查看，Esc 回队列
  switch (key) {
    case "j": case "ArrowUp": e.preventDefault(); move(-1); break;
    case "k": case "ArrowDown": e.preventDefault(); move(1); break;
    case "e": {
      e.preventDefault(); // 进编辑态的同一个键不再漏进编辑器
      var b0 = cur(); if (!b0) break;
      state.editing = true; renderCurrent(); break;
    }
    case "g": e.preventDefault(); doGate(false); break;
    case "y": e.preventDefault(); doGate(true); break;
    case "m": e.preventDefault(); doMerge(); break;
    case "a": e.preventDefault(); toggleAssetMode(); break;
    case "t": {
      state.typeMode = true;
      modebar("改型 → 1 flow · 2 structure · 3 furniture · 4 annotation · 5 asset · 6 untyped （Esc 取消）");
      break;
    }
    case "h": {
      if (!cur()) break;
      state.levelMode = true;
      showRoleSuggest();
      break;
    }
    case "i": toggleZoom(); break;
    case ",": nudgePage(-1); break;
    case ".": nudgePage(1); break;
    case "s": e.preventDefault(); exportLog(); break;
    case "Escape": if (state.assetMode) toggleAssetMode(); break;
  }
});


// ===== 启动 =====
document.getElementById("title").textContent = DATA.title + " —— 原文校对";
replayMirror();
loadUndo();
buildPages();
renderAll();
</script>
